<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather for {{ location_name }}</title>
        <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&display=swap" rel="stylesheet">    <style></style>
        <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
            <style>
                body {
                    font-family: Arial, sans-serif;
                    background-color: #eef2f3;
                    padding: 20px;
                }

                .card {
                    background: white;
                    padding: 40px; 
                    border-radius: 8px;
                    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                    text-align: center;
                    margin: 40px auto; 
                    min-width: 500px;   
                    width: max-content; 
                    max-width: 90vw; 
                }

                h2 {
                    font-family: 'Tangerine', cursive; 
                    font-weight: 700;
                    font-size: 6em; 
                    color: #0056b3;                   
                    margin-top: 0px; 
                    margin-bottom: 20px;
                    white-space: nowrap; 
                }

                h4 {
                font-family: 'Tangerine', cursive;
                font-weight: 400; 
                font-size: 3.5em; 
                color: #0056b3;
                margin-top: 25px;
                margin-bottom: 5px;
                }

                ul {
                    display: inline-block;
                    text-align: left; 
                    padding-left: 0; 
                }

                li {
                    margin-bottom: 10px;
                }

                .action-row {
                margin-top: 15px;
                margin-bottom: 25px;
                }

                .change-btn {
                padding: 10px 20px;
                background-color: #0056b3;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 16px;
                vertical-align: middle;
                margin-top: 20px;
                }

                .change-btn:hover {
                background-color: #004494;
                }

                .like-count {
                font-family: Arial, sans-serif;
                font-size: 16px;
                vertical-align: middle;
                margin-left: 5px;
                }

                a {
                display: block; 
                text-align: center; 
                margin-top: 30px;
                text-decoration: none;
                color: #0056b3;
                font-weight: bold;
                }

                #fav_btn {
                background: none; 
                border: none; 
                font-size: 1.5em; 
                cursor: pointer;
                padding: 0;
                margin-left: 5px;
                vertical-align: middle; 
                }
            </style>
    </head>

    <body>

        <div class="card">
            <h2>Weather for {{ location_name }}</h2>
            <p><strong>Currently:</strong> {{ current_temp }}°F and {{ current_condition }}</p>
            
            <p>
                <strong>Suggestion:</strong> 
                <span id="suggestion_text">{{ initial_activity }}</span> 
                <button type="button" id="fav_btn" onclick="toggleFavorite()">🤍</button>

            </p>


            <div class="action-row1">
                <span class="like-count">(<span id="fav_count">0</span> people liked this activity)</span>  
            </div>
            <div class="action-row2">
                <button type="button" class="change-btn" onclick="shuffleSuggestion()">Change the Activity</button>
            </div>
            
            <h4>Today's Summary:</h4>
            <ul>
                <li><strong>High:</strong> {{ max_temp }}°F</li>
                <li><strong>Low:</strong> {{ min_temp }}°F</li>
                <li><strong>Average:</strong> {{ avg_temp }}°F</li>
            </ul>
            
            <a href="/">← Back to search</a>
        </div>

        <script>
            let allOptions = {{ options_list | safe }};
            
            async function shuffleSuggestion() {
                let currentText = document.getElementById("suggestion_text").innerText;
                let freshOptions = allOptions.filter(opt => opt !== currentText);
                if (freshOptions.length === 0) freshOptions = allOptions;
                
                let newActivity = freshOptions[Math.floor(Math.random() * freshOptions.length)];
                document.getElementById("suggestion_text").innerText = newActivity;
                
                try {
                    let response = await fetch("/get_count/" + encodeURIComponent(newActivity));
                    let data = await response.json();
                    
                    console.log("Database says count is:", data.count);
                    
                    document.getElementById("fav_count").innerText = data.count;
                    document.getElementById("fav_btn").innerText = data.count > 0 ? "❤️" : "🤍";
                } catch (error) {
                    console.error("Fetch failed:", error);
                }
            }

            function toggleFavorite() {
                let activityText = document.getElementById("suggestion_text").innerText;
                let btn = document.getElementById("fav_btn");
                let countSpan = document.getElementById("fav_count");
                
                if (btn.innerText === "❤️") {
                    btn.innerText = "🤍";
                    countSpan.innerText = parseInt(countSpan.innerText) - 1;
                    fetch("/remove_favorite", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ "activity": activityText }) });
                } else {
                    btn.innerText = "❤️";
                    countSpan.innerText = parseInt(countSpan.innerText) + 1;
                    fetch("/save_favorite", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ "activity": activityText }) });
                }
            }
        </script>

    </body>
</html>

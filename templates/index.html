<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>How's The Weather</title>
        <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&display=swap" rel="stylesheet">    
        
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f7f6;
                padding: 20px;
                text-align: center;
            }
            
            h2 {
                font-family: 'Tangerine', cursive; 
                font-weight: 700;                 
                font-size: 6em;                   
                color: #0056b3;                   
                margin-bottom: 20px;
                margin-top: 40px;
                white-space: nowrap; 
            }

            form {
                background: white;
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                margin: 0 auto;
                min-width: 400px;
                width: max-content;
                max-width: 90vw;
            }

            input[type="text"] {
                padding: 10px;
                width: 80%;
                margin: 15px 0;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 16px;
            }

            input[type="submit"], button {
                padding: 10px 20px;
                background-color: #0056b3;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 16px;
            }

            input[type="submit"]:hover, button:hover {
                background-color: #004494;
            }
        </style>
    </head>
    <body>

        <h2>How's The Weather</h2>
        <form action="/get_weather" method="POST" id="weatherForm">
            <label for="zipcode">Enter your Zip Code, or City Name:</label><br>
            <input type="text" name="zipcode" id="zipcode" placeholder="e.g., 10001" required>
            <br>
            <input type="submit" value="Get Weather!">
            
            <br><br>
            <button type="button" onclick="getLocation()">Use My Current Location</button>
        </form>

        <script>
            function getLocation() {
                document.getElementById("zipcode").value = "Locating...";
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function(position) {  
                            let lat = position.coords.latitude;
                            let lon = position.coords.longitude;
                            let exactLocation = lat + "," + lon;
                            
                            document.getElementById("zipcode").value = exactLocation;
                            document.getElementById("weatherForm").submit();
                        }, 
                        function(error) {
                            document.getElementById("zipcode").value = "";
                            alert("Could not get your location. Please type it in manually.");
                        },
                        { timeout: 5000 } 
                    );
                } else {
                    alert("Geolocation is not supported by your browser.");
                }
            }
        </script>
    </body>
</html>
